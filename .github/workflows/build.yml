name: Build COLABEDITOR

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Geode package
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Win64

      - name: Upload .geode package
        uses: actions/upload-artifact@v4
        with:
          name: COLABEDITOR-Windows
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
